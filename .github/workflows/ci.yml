name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libluajit-5.1-dev libuv1-dev luajit luarocks

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install luajit luarocks

      - name: Install Lua dependencies and test
        run: |
          rock_tree="${RUNNER_TEMP}/luarocks"
          luajit_prefix="$(dirname "$(dirname "$(command -v luajit)")")"
          luarocks --lua-version=5.1 --lua-dir="$luajit_prefix" --tree="$rock_tree" install luautf8
          luarocks --lua-version=5.1 --lua-dir="$luajit_prefix" --tree="$rock_tree" install luv
          eval "$(luarocks --lua-version=5.1 --tree="$rock_tree" path)"
          make check
